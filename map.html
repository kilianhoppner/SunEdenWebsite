<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map </title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Sun Eden";
        src: url("./SunEden-Regular.otf") format("opentype");
      }

      @font-face {
        font-family: "ABCDiatypeRoundedEdu";
        src: url("./ABCDiatypeRoundedEdu-Light.otf") format("opentype");
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1ede6;
      }

      body {
        font-family: "ABCDiatypeRoundedEdu", Arial, sans-serif;
      }

      .map {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .map.is-dragging {
        cursor: grabbing;
      }

      .label {
        fill: #000000;
        font-size: 44px;
        letter-spacing: 0;
      }

      .map-label {
        fill: #000000;
        font-size: 34px;
        paint-order: stroke;
        stroke: #ffffff;
        stroke-width: 8px;
        stroke-linejoin: round;
      }

      .marker-label {
        dominant-baseline: hanging;
      }

      #mobileMapRotation {
        transform-box: view-box;
        transform-origin: 960px 540px;
      }

      .mobile-sky-marker {
        display: none;
      }

      @media (max-width: 820px) {
        #mobileMapRotation {
          transform: rotate(90deg);
        }

        .desktop-sky-marker {
          display: none;
        }

        .mobile-sky-marker {
          display: inline;
        }
      }

    </style>
  </head>
  <body>

      <title id="title">Sun Eden 2D Map</title>
      <desc id="desc">
        A simple symbolic 2D map of Sun Eden with a curved river, green ground,
        and basic icons for the house, mountain, campfire, and garden.

    </svg>
    <script>
      var mapSvg = document.querySelector(".map");
      var desktopBaseViewBox = { x: 0, y: 0, width: 1920, height: 1080 };
      var mobileBaseViewBox = { x: 396, y: -360, width: 1080, height: 1920 };
      var mobileMapQuery = window.matchMedia("(max-width: 820px)");
      var baseViewBox = getBaseViewBox();
      var mapZoom = 1;
      var mapCenter = {
        x: baseViewBox.x + baseViewBox.width / 2,
        y: baseViewBox.y + baseViewBox.height / 2
      };
      var dragState = null;

      function getBaseViewBox() {
        return mobileMapQuery.matches ? mobileBaseViewBox : desktopBaseViewBox;
      }

      function updateResponsiveMapViewBox() {
        var nextBaseViewBox = getBaseViewBox();
        if (
          nextBaseViewBox.x === baseViewBox.x &&
          nextBaseViewBox.y === baseViewBox.y &&
          nextBaseViewBox.width === baseViewBox.width &&
          nextBaseViewBox.height === baseViewBox.height
        ) {
          return;
        }
        baseViewBox = nextBaseViewBox;
        mapZoom = 1;
        mapCenter.x = baseViewBox.x + baseViewBox.width / 2;
        mapCenter.y = baseViewBox.y + baseViewBox.height / 2;
        applyMobileMarkerTransforms();
        applyMapViewBox();
      }

      function storeOriginalLabelPosition(label) {
        if (!label.dataset.originalX) {
          label.dataset.originalX = label.getAttribute("x") || "0";
          label.dataset.originalY = label.getAttribute("y") || "0";
        }
      }

      function getLabelAnchorShape(label) {
        var node = label.previousElementSibling;
        while (node && !/^(use|rect|circle)$/i.test(node.tagName)) {
          node = node.previousElementSibling;
        }
        return node;
      }

      function getShapeBounds(shape) {
        if (!shape) return null;
        var tagName = shape.tagName.toLowerCase();
        if (tagName === "circle") {
          var cx = parseFloat(shape.getAttribute("cx") || "0");
          var cy = parseFloat(shape.getAttribute("cy") || "0");
          var r = parseFloat(shape.getAttribute("r") || "0");
          return { x: cx - r, y: cy - r, width: r * 2, height: r * 2 };
        }
        return {
          x: parseFloat(shape.getAttribute("x") || "0"),
          y: parseFloat(shape.getAttribute("y") || "0"),
          width: parseFloat(shape.getAttribute("width") || "0"),
          height: parseFloat(shape.getAttribute("height") || "0")
        };
      }

      function getMobileLabelGap(label) {
        var text = label.textContent.trim().toLowerCase();
        if (text === "bridge") return -2;
        if (text === "cow") return 22;
        return 14;
      }

      function getMobileLabelCenterY(label, bounds) {
        var text = label.textContent.trim().toLowerCase();
        if (text === "bridge") return bounds.y + bounds.height * 0.48;
        return bounds.y + bounds.height / 2;
      }

      function applyMobileMarkerTransforms() {
        var isMobile = mobileMapQuery.matches;
        document.querySelectorAll(".mobile-counter-rotate").forEach(function (icon) {
          if (!isMobile) {
            icon.removeAttribute("transform");
            return;
          }
          var x = parseFloat(icon.getAttribute("x") || "0");
          var y = parseFloat(icon.getAttribute("y") || "0");
          var width = parseFloat(icon.getAttribute("width") || "0");
          var height = parseFloat(icon.getAttribute("height") || "0");
          var centerX = x + width / 2;
          var centerY = y + height / 2;
          icon.setAttribute("transform", "rotate(-90 " + centerX + " " + centerY + ")");
        });

        document.querySelectorAll("#mobileMapRotation .map-label").forEach(function (label) {
          storeOriginalLabelPosition(label);
          if (!isMobile) {
            label.setAttribute("x", label.dataset.originalX);
            label.setAttribute("y", label.dataset.originalY);
            label.removeAttribute("transform");
            return;
          }
          var bounds = getShapeBounds(getLabelAnchorShape(label));
          if (!bounds) return;
          var iconCenterX = bounds.x + bounds.width / 2;
          var iconCenterY = getMobileLabelCenterY(label, bounds);
          var labelX = iconCenterX + Math.max(bounds.width, bounds.height) / 2 + getMobileLabelGap(label);
          label.setAttribute("x", labelX);
          label.setAttribute("y", iconCenterY);
          label.setAttribute("transform", "rotate(-90 " + labelX + " " + iconCenterY + ")");
        });
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function applyMapViewBox() {
        var width = baseViewBox.width / mapZoom;
        var height = baseViewBox.height / mapZoom;
        var minCenterX = baseViewBox.x + width / 2;
        var maxCenterX = baseViewBox.x + baseViewBox.width - width / 2;
        var minCenterY = baseViewBox.y + height / 2;
        var maxCenterY = baseViewBox.y + baseViewBox.height - height / 2;

        mapCenter.x = clamp(mapCenter.x, minCenterX, maxCenterX);
        mapCenter.y = clamp(mapCenter.y, minCenterY, maxCenterY);

        if (mapZoom <= 1.001) {
          mapCenter.x = baseViewBox.x + baseViewBox.width / 2;
          mapCenter.y = baseViewBox.y + baseViewBox.height / 2;
        }

        mapSvg.setAttribute(
          "viewBox",
          [
            mapCenter.x - width / 2,
            mapCenter.y - height / 2,
            width,
            height
          ].join(" ")
        );
      }

      function zoomMap(step) {
        var nextZoom = clamp(mapZoom * Math.pow(1.22, step), 1, 3.1);
        mapZoom = nextZoom;
        applyMapViewBox();
      }

      mapSvg.addEventListener("pointerdown", function (event) {
        if (mapZoom <= 1.001) return;
        mapSvg.setPointerCapture(event.pointerId);
        mapSvg.classList.add("is-dragging");
        dragState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          centerX: mapCenter.x,
          centerY: mapCenter.y,
          viewWidth: baseViewBox.width / mapZoom,
          viewHeight: baseViewBox.height / mapZoom
        };
      });

      mapSvg.addEventListener("pointermove", function (event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        var dx = event.clientX - dragState.startX;
        var dy = event.clientY - dragState.startY;
        mapCenter.x = dragState.centerX - dx * (dragState.viewWidth / mapSvg.clientWidth);
        mapCenter.y = dragState.centerY - dy * (dragState.viewHeight / mapSvg.clientHeight);
        applyMapViewBox();
      });

      function stopDragging(event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        dragState = null;
        mapSvg.classList.remove("is-dragging");
      }

      mapSvg.addEventListener("pointerup", stopDragging);
      mapSvg.addEventListener("pointercancel", stopDragging);

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "suneden-map-zoom") return;
        zoomMap(event.data.step);
      });

      if (mobileMapQuery.addEventListener) {
        mobileMapQuery.addEventListener("change", updateResponsiveMapViewBox);
      } else {
        mobileMapQuery.addListener(updateResponsiveMapViewBox);
      }

      applyMobileMarkerTransforms();
      applyMapViewBox();

    </script>
  </body>
</html>
